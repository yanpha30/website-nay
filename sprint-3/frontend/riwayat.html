<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Log Status Slot — Digital Twin Smart Parking</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-page="riwayat">
  <nav class="navbar">
    <a class="brand" href="./dashboard.html">🅿️ Digital Twin <span>Smart Parking</span></a>
    <div class="nav-links">
      <a href="./index.html" target="_blank">Denah Publik ↗</a>
      <a href="./dashboard.html">Dashboard &amp; Simulator</a>
      <a href="./riwayat.html" class="active">Riwayat Log</a>
      <button id="btnLogout" class="btn-nav-danger">Logout</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Riwayat Perubahan Status Slot</h1>
        <p>Audit trail otomatis dari tabel <code>log_status_slot</code> (Simulator &amp; Admin).</p>
      </div>
      <div class="sim-bar">
        <select id="filterSlot">
          <option value="">Semua Slot (P01–P12)</option>
          <option value="P01">P01</option><option value="P02">P02</option><option value="P03">P03</option>
          <option value="P04">P04</option><option value="P05">P05</option><option value="P06">P06</option>
          <option value="P07">P07</option><option value="P08">P08</option><option value="P09">P09</option>
          <option value="P10">P10</option><option value="P11">P11</option><option value="P12">P12</option>
        </select>
        <select id="filterSumber">
          <option value="">Semua Sumber</option>
          <option value="simulator">Simulator</option>
          <option value="admin">Admin</option>
        </select>
        <button id="btnRefreshLogs" class="btn btn-primary">Muat Ulang</button>
      </div>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Slot</th>
              <th>Status Lama</th>
              <th>Status Baru</th>
              <th>Sumber</th>
              <th>ID Perangkat / Akun</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="7" style="text-align:center;color:var(--muted);">Memuat data riwayat...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="./js/app.js"></script>
</body>
</html>
