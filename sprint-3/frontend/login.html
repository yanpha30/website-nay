<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Digital Twin Smart Parking (NAY_729)</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-page="login">
  <nav class="navbar">
    <a class="brand" href="./index.html">🅿️ Digital Twin <span>Smart Parking</span></a>
    <div class="nav-links">
      <a href="./index.html">⬅️ Kembali ke Denah Publik</a>
    </div>
  </nav>

  <main class="login-wrap">
    <section class="card">
      <h1 style="font-size:1.35rem;margin-bottom:6px;">Login Pengelola</h1>
      <p style="color:var(--muted);font-size:0.88rem;margin-bottom:18px;">Masuk sebagai Admin atau Petugas untuk mengelola maintenance dan simulator.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" value="admin@parkir.test" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" value="admin123" required />
        </div>
        <div id="loginError" style="color:#dc2626;font-size:0.85rem;font-weight:600;margin-bottom:12px;display:none;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Masuk ke Dashboard</button>
      </form>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:0.8rem;color:var(--muted);">
        <strong>Akun Demo:</strong><br />
        Admin: <code>admin@parkir.test</code> / <code>admin123</code><br />
        Petugas: <code>petugas@parkir.test</code> / <code>petugas123</code>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="./js/app.js"></script>
</body>
</html>
